services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: init
      POSTGRES_PASSWORD: init_local
      POSTGRES_DB: init_member_hub
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U init -d init_member_hub"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
